<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Open-world 3D driving game at sunset: a flying electric roadster, a Sukkur-inspired city on the Indus, a loop ramp and Optimus-style robots.">
<title>Roadster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGL city; cash top-left, minimap bottom-left, speedo bottom-right, menu in a glass panel on the left third */
:root{
  --night:#140f24;
  --ink:#fff3e6;
  --dim:rgba(255,243,230,.64);
  --glow:#ffb46b;
  --cash:#9be27a;
  --hot:#ff5a5f;
  --glass:rgba(22,14,38,.46);
  --line:rgba(255,214,180,.2);
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;outline:none;touch-action:none}
#scene{display:block;width:100%;height:100%}
#game::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(12,6,24,.5) 100%)}
#flash{position:absolute;inset:0;background:var(--hot);opacity:0;pointer-events:none;z-index:4}
#flash.on{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.35}to{opacity:0}}

.hud{position:absolute;z-index:3;pointer-events:none}
.label{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tl{top:calc(20px + env(safe-area-inset-top,0px));left:calc(24px + env(safe-area-inset-left,0px));display:grid;gap:6px}
.cash{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--cash);text-shadow:0 2px 18px rgba(120,220,100,.35)}
.drift{font:700 italic 16px/1 var(--display);color:var(--glow);letter-spacing:.06em}
.bar{width:96px;height:5px;border-radius:3px;background:rgba(255,240,225,.18);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--cash);transition:width .2s linear}
@media (max-width:700px){.keys{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{font:700 12px/1.4 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#8fd8ff;text-shadow:0 0 12px rgba(120,200,255,.6)}
.tr{top:calc(20px + env(safe-area-inset-top,0px));right:calc(24px + env(safe-area-inset-right,0px));display:grid;gap:10px;justify-items:end}
.stat{display:grid;gap:4px;justify-items:end}
.val{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.chip{pointer-events:auto;font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip:focus-visible,.cta:focus-visible,.touch button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.minimap{left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:190px;height:190px;border-radius:50%;border:3px solid rgba(255,240,225,.8);box-shadow:0 6px 30px rgba(0,0,0,.45);overflow:hidden}
.minimap canvas{width:100%;height:100%;display:block}

.gauge{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:156px;height:156px}
.gauge svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,150,90,.35))}
.gauge circle{fill:none;stroke-width:9;stroke-linecap:round}
.gauge .track{stroke:rgba(255,235,215,.16);stroke-dasharray:263.9 400}
.gauge .arc{stroke:url(#gaugeGrad);stroke-dasharray:0 400;transition:stroke-dasharray .08s linear}
.readout{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px}
#kmh{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.readout small{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.gear{margin-top:6px;font:700 13px/1 var(--display);color:var(--glow);letter-spacing:.1em}

#popups{position:absolute;left:50%;top:28%;z-index:3;pointer-events:none}
.pop{position:absolute;transform:translateX(-50%);white-space:nowrap;font:700 italic 26px/1 var(--display);color:var(--ink);letter-spacing:.03em;text-shadow:0 0 18px rgba(255,150,90,.8);animation:pop 1.2s ease-out forwards}
.pop b{color:var(--cash)}
@keyframes pop{0%{opacity:0;translate:0 14px;scale:.9}15%{opacity:1;translate:0 0;scale:1}75%{opacity:1}100%{opacity:0;translate:0 -36px}}

.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;padding-left:max(16px,6vw,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(90deg,rgba(14,8,28,.75) 0%,rgba(14,8,28,.25) 55%,transparent 80%)}
.panel{width:min(560px,100%);display:grid;gap:18px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--glow)}
.panel h1{margin:0;font:700 italic clamp(44px,8vw,76px)/.92 var(--display);text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance;background:linear-gradient(180deg,#fff0d6 10%,#ffb071 60%,#ff6f61 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h1.small{font-size:clamp(34px,6vw,54px)}
.lede{margin:0;font:400 17px/1.5 var(--body);color:var(--dim);max-width:40ch}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.keys div{display:flex;align-items:center;gap:8px;font:500 15px/1 var(--body)}
kbd{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;font:700 13px/1 var(--display);color:var(--ink);background:rgba(255,240,225,.1);border:1px solid var(--line);border-bottom-width:3px;border-radius:7px}
.actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cta{font:700 16px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:#2a1022;background:linear-gradient(180deg,#ffd39a,#ff8d5c);border:0;border-radius:10px;padding:16px 26px;cursor:pointer;box-shadow:0 8px 30px rgba(255,120,80,.35)}
.cta:hover{filter:brightness(1.08)}
.hint{font:500 14px/1 var(--body);color:var(--dim)}

.touch{display:none}
@media (pointer:coarse){
  .touch{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
  .pad{display:flex;gap:12px;pointer-events:auto;align-items:flex-end}
  .touch button{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--ink);font:700 13px/1 var(--display);letter-spacing:.06em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none}
  .touch button.on{background:rgba(255,160,100,.35)}
  .touch svg{width:26px;height:26px;fill:currentColor}
  .gauge{right:auto;left:50%;transform:translateX(-50%);width:110px;height:110px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  #kmh{font-size:28px}
  .minimap{bottom:auto;top:calc(100px + env(safe-area-inset-top,0px));width:120px;height:120px}
  .hint.keyhint,.keys{display:none}
}
@media (max-width:560px){
  .overlay{align-items:flex-end;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(14,8,28,.85) 0%,rgba(14,8,28,.4) 60%,transparent 100%)}
  .cash{font-size:34px}
  .lede{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:1.6s}#flash.on{animation:none}}
</style>

</head>
<body>
<div id="game" tabindex="0">
  <canvas id="scene"></canvas>
  <div id="flash"></div>

  <div class="hud tl">
    <div class="label">Cash</div>
    <div id="cash" class="cash">$0</div>
    <div id="drift" class="drift" hidden></div>
    <div id="mode" class="mode" hidden></div>
  </div>

  <div class="hud tr">
    <div class="stat"><span class="label">Battery</span><span id="batt" class="val">100%</span><span class="bar"><i id="battBar"></i></span></div>
    <div class="stat" id="altStat" hidden><span class="label">Altitude</span><span id="alt" class="val">0 m</span></div>
    <div class="stat"><span class="label">Pickups</span><span id="picks" class="val">0</span></div>
    <div class="stat"><span class="label">Driven</span><span id="dist" class="val">0.00 km</span></div>
    <button id="mute" class="chip" type="button">Sound on</button>
  </div>

  <div class="hud minimap"><canvas id="map" width="380" height="380"></canvas></div>

  <div class="hud gauge" aria-hidden="true">
    <svg viewBox="0 0 140 140">
      <defs>
        <linearGradient id="gaugeGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#ffd39a"/>
          <stop offset=".6" stop-color="#ff8d5c"/>
          <stop offset="1" stop-color="#ff4d5e"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="70" cy="70" r="56" transform="rotate(135 70 70)"/>
      <circle id="arc" class="arc" cx="70" cy="70" r="56" transform="rotate(135 70 70)"/>
    </svg>
    <div class="readout"><span id="kmh">0</span><small>km/h</small><span id="gear" class="gear">N</span></div>
  </div>

  <div id="popups"></div>
  <div id="overlay" class="overlay"></div>

  <div class="touch">
    <div class="pad">
      <button type="button" data-k="auto" aria-label="Autopilot">AP</button>
      <button type="button" data-k="boost" aria-label="Boost">BST</button>
      <button type="button" data-k="left" aria-label="Steer left"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.5-1.6L10.2 12 17 5.6z"/></svg></button>
      <button type="button" data-k="right" aria-label="Steer right"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8L7 18.4 13.8 12 7 5.6z"/></svg></button>
    </div>
    <div class="pad">
      <button type="button" data-k="fly" aria-label="Toggle flight">FLY</button>
      <button type="button" data-k="sink" aria-label="Descend">DN</button>
      <button type="button" data-k="hand" aria-label="Handbrake or rise">HB</button>
      <button type="button" data-k="down" aria-label="Brake"><svg viewBox="0 0 24 24"><path d="M4 8.5 12 17l8-8.5L18.4 7 12 13.8 5.6 7z"/></svg></button>
      <button type="button" data-k="up" aria-label="Gas"><svg viewBox="0 0 24 24"><path d="M4 15.5 12 7l8 8.5-1.6 1.5L12 10.2 5.6 17z"/></svg></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const canvas = $('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
} catch (e) {
  $('overlay').innerHTML = '<div class="panel"><div class="eyebrow">Graphics unavailable</div><h1 class="small">WebGL is off</h1><p class="lede">This game draws with WebGL. Turn on hardware acceleration in your browser settings, then reload the page.</p></div>';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// City grid: N x N blocks, roads on every grid line
const N = 10, ROAD = 14, CELL = 60, BLOCK = CELL - ROAD, O = -N * CELL / 2;
const MAX = 62, REV = 12, FLY_MAX = 85, BOOST = 1.45, ALT_MAX = 400;
const col = h => new THREE.Color(h).convertSRGBToLinear();
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const aniso = renderer.capabilities.getMaxAnisotropy();
const node = i => O + i * CELL;

const scene = new THREE.Scene();
const HORIZON = '#dbe7f1';
scene.fog = new THREE.Fog(HORIZON, 160, 1900);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 3600);
const SUN = new THREE.Vector3(-0.38, 0.3, -1).normalize();
const LIGHT_DIR = new THREE.Vector3(-0.45, 0.75, -0.6).normalize();

// Sky
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: new THREE.Color('#2f6fcf') },
    mid: { value: new THREE.Color('#8fc0ec') },
    horizon: { value: new THREE.Color(HORIZON) },
    below: { value: new THREE.Color('#9fb0bf') },
    sunDir: { value: SUN },
    space: { value: 0 },
    time: { value: 0 },
    toLinear: { value: 0 }
  },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform vec3 top, mid, horizon, below, sunDir;
    uniform float space, time, toLinear;
    float hsh(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hsh(i), hsh(i + vec2(1.0, 0.0)), f.x), mix(hsh(i + vec2(0.0, 1.0)), hsh(i + vec2(1.0, 1.0)), f.x), f.y); }
    float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * vn(p); p *= 2.03; a *= 0.5; } return v; }
    varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 c = mix(horizon, mid, smoothstep(0.0, 0.2, h));
      c = mix(c, top, smoothstep(0.18, 0.7, h));
      c = mix(c, below, 1.0 - smoothstep(-0.1, 0.0, h));
      float s = max(dot(d, sunDir), 0.0);
      c += vec3(1.0, 0.86, 0.62) * pow(s, 8.0) * 0.3;
      c += vec3(1.0, 0.95, 0.85) * pow(s, 80.0) * 0.8;
      c = mix(c, vec3(1.0, 0.95, 0.82), smoothstep(0.9984, 0.9992, s));
      float star = step(0.9975, fract(sin(dot(floor(d * 420.0), vec3(12.9898, 78.233, 45.164))) * 43758.5453));
      c = mix(c, vec3(0.01, 0.012, 0.035) + star * vec3(0.9), space * smoothstep(-0.25, 0.05, h));
      c = mix(c, vec3(1.0, 0.97, 0.9), space * smoothstep(0.9984, 0.9992, s));
      c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
      if (h > 0.0) {
        vec2 cuv = d.xz / (h + 0.06) * 0.55 + vec2(time * 0.012, time * 0.004);
        float n = fbm(cuv);
        float cov = smoothstep(0.52, 0.8, n) * smoothstep(0.0, 0.1, h) * (1.0 - space);
        vec3 lit = mix(vec3(1.0), vec3(1.0, 0.93, 0.8), pow(s, 4.0));
        vec3 cc = mix(vec3(0.64, 0.7, 0.8), lit, smoothstep(0.5, 0.95, n + s * 0.35));
        c = mix(c, cc, cov * 0.85);
      }
      c = max(c, vec3(0.0));
      c = mix(c, pow(c, vec3(2.2)), toLinear);
      gl_FragColor = vec4(c, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2800, 48, 24), skyMat);
sky.renderOrder = -1;
scene.add(sky);

const envCanvas = document.createElement('canvas');
envCanvas.width = 512; envCanvas.height = 256;
{
  const g = envCanvas.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f6fcf'); gr.addColorStop(0.3, '#8fc0ec'); gr.addColorStop(0.5, HORIZON);
  gr.addColorStop(0.52, '#7d8f6a'); gr.addColorStop(1, '#4d5a40');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 256);
  const sg = g.createRadialGradient(150, 120, 0, 150, 120, 90);
  sg.addColorStop(0, 'rgba(255,240,200,1)'); sg.addColorStop(1, 'rgba(255,160,100,0)');
  g.fillStyle = sg; g.fillRect(0, 0, 512, 256);
}
const envTex = new THREE.CanvasTexture(envCanvas);
envTex.mapping = THREE.EquirectangularReflectionMapping;
envTex.encoding = THREE.sRGBEncoding;
scene.environment = new THREE.PMREMGenerator(renderer).fromEquirectangular(envTex).texture;

// Lights
scene.add(new THREE.HemisphereLight(col('#d6e6ff'), col('#6f7a4a'), 0.75));
const sunLight = new THREE.DirectionalLight(col('#fff0d8'), 2.6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 400 });
sunLight.shadow.camera.updateProjectionMatrix();
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.04;
scene.add(sunLight, sunLight.target);
const rim = new THREE.DirectionalLight(col('#cfe0ff'), 0.6);
rim.position.set(6, 12, 20);
scene.add(rim);

// Textures
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = aniso;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
function speckle(g, W, H, n) {
  for (let i = 0; i < n; i++) {
    const v = 28 + Math.random() * 64 | 0;
    g.fillStyle = `rgba(${v},${v},${v + 6},.35)`;
    g.fillRect(Math.random() * W, Math.random() * H, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}
const ASPHALT = '#37393f';
const asphaltTex = canvasTex(256, 256, (g, W, H) => { g.fillStyle = ASPHALT; g.fillRect(0, 0, W, H); speckle(g, W, H, 3000); });
asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping;
asphaltTex.repeat.set(N * 6, N * 6);

// One road segment between two intersections: 14 m wide, 46 m long
const roadTex = canvasTex(256, 840, (g, W, H) => {
  const X = m => (m + ROAD / 2) / ROAD * W, pm = H / BLOCK;
  g.fillStyle = ASPHALT; g.fillRect(0, 0, W, H);
  speckle(g, W, H, 9000);
  g.fillStyle = 'rgba(16,16,20,.2)';
  [-5.25, -1.75, 1.75, 5.25].forEach(l => [-0.8, 0.8].forEach(o => g.fillRect(X(l + o) - 7, 0, 14, H)));
  g.fillStyle = '#ece4d6';
  g.fillRect(X(-6.6) - 2, 0, 4, H); g.fillRect(X(6.6) - 2, 0, 4, H);
  for (let y = pm * 6; y < H - pm * 6; y += pm * 9) [-3.5, 3.5].forEach(x => g.fillRect(X(x) - 2, y, 4, pm * 3));
  [0, H - pm * 3.2].forEach(y0 => { for (let x = -6.2; x < 6.4; x += 1.2) g.fillRect(X(x), y0 + pm * 0.3, X(0.6) - X(0), pm * 2.6); });
  g.fillRect(0, pm * 4, W / 2, pm * 0.4);
  g.fillRect(W / 2, H - pm * 4.4, W / 2, pm * 0.4);
  g.fillStyle = '#f2c14e';
  g.fillRect(X(-0.18) - 2, pm * 4.4, 4, H - pm * 8.8); g.fillRect(X(0.18) - 2, pm * 4.4, 4, H - pm * 8.8);
});

const grassTex = canvasTex(512, 512, (g, W, H) => {
  g.fillStyle = '#5d8a3c'; g.fillRect(0, 0, W, H);
  const tones = ['#4f7d33', '#6e9a45', '#7f8f4a', '#3f6b2c', '#8a9a55'];
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = tones[i % tones.length];
    g.globalAlpha = 0.25;

function pickDir(i, j, from) {
  const opts = [];
  DIRS.forEach(([dx, dz], d) => {
    if (from >= 0 && d === (from + 2) % 4) return;
    const ni = i + dx, nj = j + dz;
    if (ni >= 0 && ni <= N && nj >= 0 && nj <= N) opts.push(d);
  });
  if (from >= 0 && opts.includes(from) && Math.random() < 0.5) return from;
  return opts[Math.random() * opts.length | 0];
}
function carLogicalPos(t) {
  const [dx, dz] = DIRS[t.d];
  return [node(t.i) + dx * t.s + (-dz) * t.lane, node(t.j) + dz * t.s + dx * t.lane];
}

}

  if (car.stunt) { camera.position.set(LOOP.xc + 18, 9, LOOP.z + 46); look.set(car.x, car.y + 1, car.z); camH = car.h; }
  camera.lookAt(look);
  fovKick = damp(fovKick, boosting && keys.up ? 12 : 0, 4, dt);
  camera.fov = 60 + speed * 0.08 + portrait * 12 + fovKick;
  camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  mountains.position.set(car.x, 0, car.z);
  waveMaps.forEach(t => { t.offset.x = clock * 0.004; t.offset.y = clock * 0.007; });
  waveMaps.foam.material.opacity = 0.25 + Math.sin(clock * 1.3) * 0.12;

  sunLight.position.set(car.x + LIGHT_DIR.x * 160, LIGHT_DIR.y * 160, car.z + LIGHT_DIR.z * 160);
  sunLight.target.position.set(car.x, 0, car.z);

  // HUD
  const gear = Math.min(5, Math.floor(Math.abs(vf) / 12.5));
  const rpm = clamp((Math.abs(vf) - gear * 12.5) / 12.5, 0, 1);
  updateAudio(gear, rpm, speed, slip);
  drawMap();
  hudT -= dt;
  if (hudT <= 0) {
    hudT = 0.05;
    cashEl.textContent = '$' + cash.toLocaleString();
    picksEl.textContent = picks;
    distEl.textContent = (driven / 1000).toFixed(2) + ' km';
    kmhEl.textContent = Math.round(speed * 3.6);
    gearEl.textContent = car.fly ? 'FLY' : vf < -0.5 ? 'R' : speed < 0.5 ? 'N' : 'G' + (gear + 1);
    arcEl.style.strokeDasharray = `${(263.9 * Math.min(1, speed / top)).toFixed(1)} 400`;
    altStat.hidden = car.y < 1.5;
    altEl.textContent = Math.round(car.y) + ' m';
    const modes = [];
    if (car.fly) modes.push('Flight · Space up · Shift down');
    if (car.auto) modes.push('Autopilot · steer or brake to take over');
    if (boosting && keys.up) modes.push('Boost');
    if (charging) modes.push(`Supercharging · ${Math.floor(car.batt)}%`);
    if (car.batt <= 0) modes.push('Battery empty · find a Supercharger');
    modeEl.hidden = !modes.length;
    modeEl.innerHTML = modes.join('<br>');
    battEl.textContent = Math.floor(car.batt) + '%';
    battBar.style.width = car.batt + '%';
    battBar.style.background = car.batt < 20 ? 'var(--hot)' : 'var(--cash)';
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  if (composer) composer.render(dt);
  else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

camera.position.set(car.x, 3.3, car.z + 8.5);
showReady();
$('game').focus({ preventScroll: true });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
